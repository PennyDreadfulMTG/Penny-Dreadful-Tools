name: Run Tests
on: ['push', 'pull_request']

# Keep automated dependency updates from filling all available runners while
# allowing human-authored changes to run without a concurrency limit.
concurrency:
  group: ${{ github.actor == 'dependabot[bot]' && 'dependabot-ci' || github.run_id }}
  queue: max

jobs:
  mypy:
    name: mypy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: '0.9.26'
        enable-cache: true
    - uses: PennyDreadfulMTG/setup-linters@main
    - name: Install dependencies
      run: uv sync --frozen --dev
    - name: Run mypy
      run: uv run --frozen python dev.py mypy
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: '0.9.26'
        enable-cache: true
    - uses: PennyDreadfulMTG/setup-linters@main
    - name: Install dependencies
      run: uv sync --frozen --dev
    - name: Run lint
      run: uv run --frozen python dev.py lint

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      mysql_user: root
      mysql_passwd: bad-password
      mysql_host: 127.0.0.1

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: '0.9.26'
        enable-cache: true
    - uses: getong/mariadb-action@v1.11
      with:
        mysql root password: bad-password
        mariadb version: 11
    - name: Install dependencies
      run: uv sync --frozen --dev
    - uses: PennyDreadfulMTG/setup-linters@main
    - run: uv run --frozen python run.py init-cards
    - name: Run pytest
      run: |
        uv run --frozen pytest
    - uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v6.5.0
      if: always() # always run even if the previous step fails
      with:
        report_paths: '**/TestResults.xml'
        check_name: 'Pytest Results'

  jslint:
    name: jslint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: '0.9.26'
        enable-cache: true
    - name: Setup Node.js environment
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.12.0
    - name: Install dependencies
      run: python build.py
    - name: Run jslint
      run: uv run --frozen python dev.py jslint

  browser:
    name: browser
    runs-on: ubuntu-latest
    env:
      mysql_user: root
      mysql_passwd: bad-password
      mysql_host: 127.0.0.1

    steps:
    - uses: actions/checkout@v7
      with:
        lfs: true  # The font sources the symbols font is built from are LFS objects.
    - name: Set up Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: '0.9.26'
        enable-cache: true
    - name: Setup Node.js environment
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.12.0
        cache: npm
    - uses: getong/mariadb-action@v1.11
      with:
        mysql root password: bad-password
        mariadb version: 11
    - name: Install dependencies
      run: uv sync --frozen --dev
    - name: Build javascript
      run: npm ci && npm run build
    - name: Install Chromium
      run: uv run --frozen playwright install --with-deps chromium
    - run: uv run --frozen python run.py init-cards
    - name: Build symbols font
      run: uv run --frozen python run.py maintenance fonts
    - name: Run browser tests
      run: PD_BROWSER_TESTS=1 uv run --frozen pytest --no-cov -p no:cacheprovider decksite/browser_test.py
