# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
ci:
    # This system hook uses the developer's project environment. GitHub Actions
    # runs mypy separately; pre-commit.ci does not provide uv.
    skip: [mypy]

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: requirements-txt-fixer
    -   id: no-commit-to-branch
        args: [-b, master]
-   repo: https://github.com/PyCQA/autoflake
    rev: v2.4.0
    hooks:
        - id: autoflake
          args: [--remove-all-unused-imports, --in-place, --ignore-init-module-imports]
          exclude: wsgi$
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
        args: [--py310-plus]
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
        -   id: ruff
            args: ["--select", "I", "--fix"]
        -   id: ruff
            name: ruff-lint
            args: []
            # WSGI entrypoints expose imported application objects to the server
            # and are not scanned by the project's `dev.py lint` command.
            exclude: wsgi$
-   repo: local
    hooks:
    -   id: mypy
        name: mypy
        language: system
        entry: uv run --frozen python dev.py mypy
        types: [python]
        pass_filenames: false
