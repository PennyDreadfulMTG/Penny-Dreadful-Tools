services:
  decksite:
    build: .
    command:
      - decksite
    ports:
      - "${DECKSITE_HOST_PORT:-80}:80"
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      - mysql_host=db
      - redis_host=redis
    volumes:
      - ./decksite:/pdm/decksite
      - ./find:/pdm/find
      - ./images:/pdm/images
      - ./magic:/pdm/magic
      - ./maintenance:/pdm/maintenance
      - ./shared:/pdm/shared
      - ./shared_web:/pdm/shared_web
      - node_modules:/pdm/node_modules
      - compiled_js:/pdm/shared_web/static/dist

  logsite:
    build: .
    command:
      - logsite
    ports:
      - "${LOGSITE_HOST_PORT:-5001}:5001"
    depends_on:
      - db
      - redis
    env_file: .env
    environment:
      - mysql_host=db
      - redis_host=redis
    volumes:
      - ./logsite_migrations:/pdm/logsite_migrations
      - ./logsite:/pdm/logsite
      - ./shared:/pdm/shared
      - ./shared_web:/pdm/shared_web
      - node_modules:/pdm/node_modules
      - compiled_js:/pdm/shared_web/static/dist

  assets:
    image: node:22-alpine
    working_dir: /pdm
    command:
      - sh
      - -c
      - |
        npm install
        npm run babel
        npm run watch
    volumes:
      - ./decksite/webpack.config.js:/pdm/decksite/webpack.config.js
      - ./package.json:/pdm/package.json
      - ./package-lock.json:/pdm/package-lock.json
      - ./shared_web:/pdm/shared_web
      - node_modules:/pdm/node_modules
      - compiled_js:/pdm/shared_web/static/dist

  # discordbot:
  #   build: .
  #   command: ["uv", "run", "--frozen", "python", "run.py", "--wait-for-db", "discordbot"]
  #   depends_on:
  #     - db
  #     - redis
  #   env_file: .env
  #   environment:
  #     - mysql_host=db
  #     - redis_host=redis
  #   volumes:
  #     - ./discordbot:/pdm/discordbot
  #     - ./magic:/pdm/magic
  #     - ./shared:/pdm/shared

  db:
    build: docker_dev/mysql
    env_file: .env
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=true
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_HOST_PORT:-3306}:3306"

  adminer:
    image: adminer
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"
    command: [ "php", "-d", "upload_max_filesize = 10G", "-d", "post_max_size = 10G", "-S", "[::]:8080", "-t", "/var/www/html" ]

  redis:
    image: redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

volumes:
  db_data:
  node_modules:
  compiled_js:
